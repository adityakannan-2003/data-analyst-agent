[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Ask questions about a CSV in plain English. A tool-calling agent on the Claude API, written without an agent framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pandas",
    "matplotlib",
    "python-dotenv",
    "openpyxl>=3.1.5",
    "streamlit>=1.65.0",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
]
# The LangGraph version of the loop (graph_agent.py) and its tests. Not a default group, so a plain
# `uv sync`, which is how the public app on Streamlit installs, leaves it out. `uv sync --all-groups` adds it.
langgraph = [
    "jiter>=0.17.0",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.19",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
